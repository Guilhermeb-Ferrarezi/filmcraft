name: cursors-check
on:
  push:
    branches: [ci/cursors-check]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libx11-dev libxkbcommon-dev libwayland-dev libasound2-dev libudev-dev libgl1-mesa-dev libxcb1-dev
      - run: rustup update stable && rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
        continue-on-error: true
      - run: cargo clippy -p filmcraft-ui-egui --all-targets -- -D warnings
        continue-on-error: true
      - run: cargo test -p filmcraft-ui-egui cursors timeline
        continue-on-error: true
      - run: cargo xtask layers
        continue-on-error: true
      - run: cargo xtask assets
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cursor-svg
          path: target/cursor-svg
