name: all
on:
  push:
    branches: [ci/all]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libx11-dev libxkbcommon-dev libwayland-dev libasound2-dev libudev-dev libgl1-mesa-dev libxcb1-dev
      - run: rustup update stable && rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
        continue-on-error: true
      - run: cargo clippy -p filmcraft-render -p filmcraft-ui-egui --all-targets -- -D warnings
        continue-on-error: true
      - run: cargo test -p filmcraft-render vfx
        continue-on-error: true
      - run: cargo test -p filmcraft-ui-egui
        continue-on-error: true
      - run: cargo xtask layers
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cursor-svg
          path: target/cursor-svg
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p filmcraft -p filmcraft-cli
      - uses: actions/upload-artifact@v4
        with:
          name: filmcraft-win-x64
          path: |
            target/release/filmcraft.exe
            target/release/filmcraft-cli.exe
